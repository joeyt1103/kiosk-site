<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Rate Entertainment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --acts-blue:#0072bc;
  --acts-blue-dark:#005a96;
  --acts-blue-light:#e8f2fa;
  --acts-red:#ee2842;
  --acts-burgundy:#980539;
  --bg:#f4f6f8;
  --card:#FFFFFF;
  --text:#1C1C1E;
  --text-secondary:#6B7280;
  --text-tertiary:#AEAEB2;
  --border:#E5E5EA;
  --shadow:0 2px 20px rgba(0,0,0,0.07), 0 0 1px rgba(0,0,0,0.1);
  --radius:20px;
  --input-radius:14px;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}

body{
  font-family:"Work Sans",-apple-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* Brand bar */
.brand-bar{
  width:100%;
  height:5px;
  background:linear-gradient(90deg, var(--acts-blue) 0%, var(--acts-blue) 40%, var(--acts-red) 40%, var(--acts-red) 70%, var(--acts-burgundy) 70%, var(--acts-burgundy) 100%);
  flex-shrink:0;
}

/* Navigation bar */
.nav{
  position:sticky;
  top:0;
  z-index:100;
  padding:14px 24px;
  padding-top:calc(14px + var(--safe-top));
  background:rgba(244,246,248,0.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(0,0,0,0.06);
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  color:var(--acts-blue);
  font-size:18px;
  font-weight:600;
  padding:8px 4px;
  border-radius:10px;
  transition:opacity 0.2s;
}

.back-btn:active{opacity:0.5}
.back-btn svg{flex-shrink:0}

.nav-title{
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.3px;
  color:var(--text);
}

/* Page header band */
.page-header{
  background:linear-gradient(135deg, var(--acts-red), var(--acts-burgundy));
  padding:24px 24px 28px;
  position:relative;
  overflow:hidden;
}

.page-header::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,0.05);
  top:-60px;
  right:-30px;
}

.page-header-inner{
  max-width:560px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

.page-header h1{
  font-size:28px;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.3px;
  margin-bottom:4px;
}

.page-header p{
  font-size:15px;
  color:rgba(255,255,255,0.75);
  font-weight:500;
}

/* Page layout */
.page{
  max-width:560px;
  margin:0 auto;
  padding:20px 24px 40px;
  padding-bottom:calc(40px + var(--safe-bottom));
  opacity:0;
  transform:translateY(12px);
  animation:pageIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
}

@keyframes pageIn{
  to{opacity:1;transform:translateY(0)}
}

/* Cards */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:28px 24px;
  margin-bottom:16px;
}

.card-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}

.card-header-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.card-header-icon.red{background:rgba(238,40,66,0.1)}
.card-header-icon.red svg{color:var(--acts-red)}

.card-header-title{
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.8px;
  color:var(--text-secondary);
}

/* Form fields */
.field{margin-bottom:24px}
.field:last-child{margin-bottom:0}

.field-label{
  display:block;
  font-size:16px;
  font-weight:700;
  margin-bottom:10px;
  color:var(--text);
}

.field-input{
  width:100%;
  padding:16px 18px;
  font-size:20px;
  font-family:inherit;
  border-radius:var(--input-radius);
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance:none;
  appearance:none;
}

.field-input:focus{
  border-color:var(--acts-blue);
  box-shadow:0 0 0 4px rgba(0,114,188,0.12);
}

.field-input::placeholder{color:var(--text-tertiary)}

textarea.field-input{
  resize:vertical;
  min-height:120px;
  line-height:1.5;
}

/* Rating scale */
.scale{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.tile{
  text-align:center;
  padding:16px 8px;
  border-radius:16px;
  background:#F2F2F7;
  cursor:pointer;
  user-select:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:2.5px solid transparent;
  transition:transform 0.2s cubic-bezier(0.16,1,0.3,1), border-color 0.25s, background 0.25s, box-shadow 0.25s;
  -webkit-tap-highlight-color:transparent;
}

.tile:active{transform:scale(0.93)}

.emoji{font-size:40px;line-height:1}

.tile-label{
  font-size:14px;
  font-weight:600;
  color:var(--text-secondary);
  transition:color 0.25s;
}

input[type=radio].rating-radio{display:none}

input.rating-radio:checked + .tile{
  border-color:var(--acts-blue);
  background:var(--acts-blue-light);
  box-shadow:0 2px 12px rgba(0,114,188,0.15);
}

input.rating-radio:checked + .tile .tile-label{
  color:var(--acts-blue);
  font-weight:700;
}

/* Submit button */
.submit-btn{
  display:block;
  width:100%;
  padding:18px;
  font-size:20px;
  font-family:inherit;
  border:none;
  border-radius:16px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg, var(--acts-red), var(--acts-burgundy));
  cursor:pointer;
  transition:transform 0.15s, opacity 0.2s;
  -webkit-tap-highlight-color:transparent;
  -webkit-appearance:none;
  appearance:none;
  box-shadow:0 4px 14px rgba(238,40,66,0.25);
}

.submit-btn:active{transform:scale(0.97)}
.submit-btn:disabled{opacity:0.5;transform:none}

/* Processing overlay */
#processingOverlay{
  position:fixed;
  inset:0;
  background:rgba(244,246,248,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:48px;
  height:48px;
  border:4px solid var(--border);
  border-top:4px solid var(--acts-red);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin-bottom:16px;
}

@keyframes spin{to{transform:rotate(360deg)}}

#processingOverlay h3{
  font-size:20px;
  font-weight:600;
  color:var(--text-secondary);
}

/* Success */
.success-screen{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10000;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.success-check{
  width:80px;
  height:80px;
  border-radius:50%;
  background:linear-gradient(135deg,#34C759,#30D158);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
  animation:popIn 0.5s cubic-bezier(0.16,1,0.3,1);
}

@keyframes popIn{
  0%{transform:scale(0);opacity:0}
  50%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}

.success-check svg{
  width:40px;
  height:40px;
  stroke:#fff;
  stroke-width:3;
  fill:none;
  stroke-dasharray:50;
  stroke-dashoffset:50;
  animation:drawCheck 0.4s 0.3s ease forwards;
}

@keyframes drawCheck{to{stroke-dashoffset:0}}

.success-text{
  font-size:24px;
  font-weight:700;
  color:var(--text);
}

/* Footer */
.footer{
  text-align:center;
  padding:16px 24px 24px;
  padding-bottom:calc(24px + var(--safe-bottom));
}

.footer-line{
  width:40px;
  height:3px;
  border-radius:3px;
  background:linear-gradient(90deg, var(--acts-red), var(--acts-burgundy));
  margin:0 auto 8px;
}

.footer p{font-size:12px;color:#bbb;font-weight:500}

/* Responsive: stack rating 3+2 on smaller screens */
@media(max-width:480px){
  .scale{grid-template-columns:repeat(3,1fr)}
}

/* iPad tweaks */
@media(min-width:768px){
  .page{padding-top:24px}
  .page-header{padding:28px 24px 32px}
  .page-header h1{font-size:32px}
  .page-header p{font-size:17px}
  .nav-title{font-size:22px}
  .field-input{font-size:22px;padding:18px 20px}
  .tile{padding:20px 10px}
  .emoji{font-size:48px}
  .tile-label{font-size:16px}
  .submit-btn{font-size:22px;padding:20px}
  .card{padding:32px 28px}
}
</style>
</head>

<body>
<div class="brand-bar"></div>

<div class="nav">
  <a class="back-btn" href="index.html">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>
  <span class="nav-title">Rate Entertainment</span>
</div>

<div class="page-header">
  <div class="page-header-inner">
    <h1>Share Your Feedback</h1>
    <p>Help us bring you the best entertainment</p>
  </div>
</div>

<div class="page">
  <div class="card">
    <div class="card-header">
      <div class="card-header-icon red">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <span class="card-header-title">Your Rating</span>
    </div>

    <form id="entForm" autocomplete="off">

      <div class="field">
        <label class="field-label" for="name">Name</label>
        <input class="field-input" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="field">
        <label class="field-label">How much did you enjoy it?</label>
        <div class="scale">
          <label>
            <input type="radio" class="rating-radio" name="rating" value="1" required>
            <div class="tile"><div class="emoji">☹️</div><div class="tile-label">Very Poor</div></div>
          </label>
          <label>
            <input type="radio" class="rating-radio" name="rating" value="2">
            <div class="tile"><div class="emoji">🙁</div><div class="tile-label">Poor</div></div>
          </label>
          <label>
            <input type="radio" class="rating-radio" name="rating" value="3">
            <div class="tile"><div class="emoji">😐</div><div class="tile-label">Okay</div></div>
          </label>
          <label>
            <input type="radio" class="rating-radio" name="rating" value="4">
            <div class="tile"><div class="emoji">🙂</div><div class="tile-label">Good</div></div>
          </label>
          <label>
            <input type="radio" class="rating-radio" name="rating" value="5">
            <div class="tile"><div class="emoji">😄</div><div class="tile-label">Excellent</div></div>
          </label>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="comment">Comment</label>
        <textarea class="field-input" id="comment" name="comment" rows="5" placeholder="Tell us what you liked or what could be better..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <p>Acts Retirement-Life Communities</p>
  </div>
</div>

<div id="processingOverlay">
  <div class="spinner"></div>
  <h3>Processing...</h3>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0SzgDWMhx1x9pXNJzOKvh2oFpScZ04cO4COBfO_EfHcwSbagYgO1F8u9_1CFb0RSF/exec";

  document.getElementById("entForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const rating = document.querySelector("input[name=rating]:checked")?.value;
    const comment = document.getElementById("comment").value.trim();

    if (!name) { alert("Please enter your name."); return; }
    if (!rating) { alert("Please select a rating."); return; }

    const overlay = document.getElementById("processingOverlay");
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    overlay.style.display = "flex";

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          type: "entertainment",
          name,
          rating,
          comment
        })
      });

      /* Success screen */
      const success = document.createElement("div");
      success.className = "success-screen";
      success.innerHTML = `
        <div class="success-check">
          <svg viewBox="0 0 24 24"><path d="M4 12.5L9.5 18L20 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="success-text">Submitted Successfully</div>
      `;
      document.body.appendChild(success);
      setTimeout(() => location.href = "index.html", 1500);

    } catch (err) {
      alert("Submission failed. Please try again.");
      btn.disabled = false;
      overlay.style.display = "none";
      console.error(err);
    }
  });
</script>
</body>
</html>
