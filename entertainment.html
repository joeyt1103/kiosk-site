<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rate Entertainment</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .top { display:flex; gap:12px; align-items:center; }
    .top a { text-decoration:none; font-size:16px; }
    h2 { margin: 0; }

    label.hdr { display:block; margin-top: 16px; font-weight: 750; }

    input[type="text"], textarea {
      width: 100%;
      font-size: 18px;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    /* 5-point scale */
    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .option input { display:none; }
    .tile {
      border: 2px solid #ccc;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      user-select: none;
      font-size: 16px;
      line-height: 1.2;
      cursor: pointer;
    }
    .emoji { font-size: 38px; display:block; margin-bottom: 8px; }

    /* red -> yellow -> green */
    .c1 { background: #ffd6d6; }
    .c2 { background: #ffe2cc; }
    .c3 { background: #fff2cc; }
    .c4 { background: #e9f7d8; }
    .c5 { background: #d9f7df; }

    .option input:checked + .tile {
      border-color: #000;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.08);
    }

    button {
      margin-top: 18px;
      width: 100%;
      font-size: 20px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .muted { color:#666; font-size:14px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">← Back</a>
    <h2>Rate Entertainment</h2>
  </div>

  <form id="entForm" autocomplete="off">
    <label class="hdr" for="name">Name</label>
    <input id="name" name="name" type="text" required />

    <label class="hdr">How much did you enjoy it?</label>
    <div class="scale">
      <label class="option">
        <input type="radio" name="rating" value="1" required>
        <div class="tile c1"><span class="emoji">☹️</span>Very Poor</div>
      </label>

      <label class="option">
        <input type="radio" name="rating" value="2">
        <div class="tile c2"><span class="emoji">🙁</span>Poor</div>
      </label>

      <label class="option">
        <input type="radio" name="rating" value="3">
        <div class="tile c3"><span class="emoji">😐</span>Okay</div>
      </label>

      <label class="option">
        <input type="radio" name="rating" value="4">
        <div class="tile c4"><span class="emoji">🙂</span>Good</div>
      </label>

      <label class="option">
        <input type="radio" name="rating" value="5">
        <div class="tile c5"><span class="emoji">😄</span>Excellent</div>
      </label>
    </div>

    <label class="hdr" for="comment">Comment</label>
    <textarea id="comment" name="comment" rows="5" placeholder="Tell us what you liked or what could be better..."></textarea>

    <p class="muted">Tap Submit to send your rating.</p>

    <button type="submit">Submit</button>
  </form>

  <script>
    // Replace with your Formspree "Entertainment" form endpoint:
    // Example: https://formspree.io/f/abcdwxyz
    const FORMSPREE_ENTERTAINMENT_URL = "https://formspree.io/f/mgoovvop";

    function showSuccessAndReturn() {
      document.body.innerHTML = `
        <div style="font-family:system-ui, -apple-system, sans-serif; padding:20px; max-width:800px; margin:0 auto;">
          <h3>Submitted successfully ✅</h3>
          <p>Returning to the home screen…</p>
        </div>`;
      setTimeout(() => { window.location.href = "index.html"; }, 1500);
    }

    document.getElementById("entForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const rating = document.querySelector('input[name="rating"]:checked')?.value;

      if (!name) { alert("Please enter your name."); return; }
      if (!rating) { alert("Please select a rating."); return; }

      const form = document.getElementById("entForm");

      try {
        const res = await fetch(FORMSPREE_ENTERTAINMENT_URL, {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form)
        });

        if (!res.ok) throw new Error("Submission failed");
        showSuccessAndReturn();
      } catch (err) {
        alert("Submission failed. Please check internet and try again.");
      }
    });
  </script>
</body>
</html>
