<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Entertainment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  body{margin:0;font-family:"Work Sans",system-ui;background:#f6f8fb}
  .page{max-width:860px;margin:0 auto;padding:30px}
  .top{display:flex;gap:12px;align-items:center}
  .top a{text-decoration:none;color:#005a96;font-weight:700}
  .card{background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.08);padding:24px}
  label{display:block;margin-top:16px;font-weight:800}
  textarea,input{width:100%;padding:14px;font-size:18px;border-radius:12px;border:2px solid #ccc}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
  .tile{text-align:center;padding:12px;border-radius:12px;background:#eee;cursor:pointer}
  input[type=radio]{display:none}
  input:checked + .tile{outline:3px solid #0072bc}
  button{margin-top:20px;width:100%;padding:16px;font-size:20px;border:none;border-radius:14px;font-weight:800;color:#fff;background:#0072bc}
</style>
</head>

<body>
<div class="page">
  <div class="top">
    <a href="index.html">← Back</a>
    <h2>Rate Entertainment</h2>
  </div>

  <div class="card">
    <form id="entForm">
      <label>Name</label>
      <input id="name" required>

      <label>How was it?</label>
      <div class="scale">
        <label><input type="radio" name="rating" value="1"><div class="tile">☹️</div></label>
        <label><input type="radio" name="rating" value="2"><div class="tile">🙁</div></label>
        <label><input type="radio" name="rating" value="3"><div class="tile">😐</div></label>
        <label><input type="radio" name="rating" value="4"><div class="tile">🙂</div></label>
        <label><input type="radio" name="rating" value="5"><div class="tile">😄</div></label>
      </div>

      <label>Comment</label>
      <textarea id="comment"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0SzgDWMhx1x9pXNJzOKvh2oFpScZ04cO4COBfO_EfHcwSbagYgO1F8u9_1CFb0RSF/exec";

document.getElementById("entForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const rating = document.querySelector("input[name=rating]:checked")?.value;
  const comment = document.getElementById("comment").value;

  await fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    body: JSON.stringify({type:"entertainment",name,rating,comment})
  });

  document.body.innerHTML = "<h2 style='text-align:center;margin-top:40px'>Submitted successfully ✅</h2>";
  setTimeout(()=>location.href="index.html",1500);
});
</script>
</body>
</html>
