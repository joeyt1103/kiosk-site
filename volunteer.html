<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer Hours</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; }
    label { display:block; margin-top: 14px; font-weight: 650; }
    input, textarea { width: 100%; font-size: 18px; padding: 12px; margin-top: 6px; border-radius: 10px; border: 1px solid #ccc; }
    button { margin-top: 18px; width: 100%; font-size: 20px; padding: 14px; border-radius: 12px; border: 1px solid #ccc; cursor: pointer; }
    .top { display:flex; gap:12px; align-items:center; }
    .top a { text-decoration:none; font-size:16px; }
    .muted { color:#666; font-size:14px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">← Back</a>
    <h2 style="margin:0;">Volunteer Hours</h2>
  </div>

  <form id="volForm" autocomplete="off">
    <label for="name">Name</label>
    <input id="name" name="name" required />

    <label for="hours">Hours volunteered</label>
    <input id="hours" name="hours" type="number" step="0.25" min="0" required />

    <p class="muted">Tap Submit to log your hours.</p>

    <button type="submit">Submit</button>
  </form>

 <script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0SzgDWMhx1x9pXNJzOKvh2oFpScZ04cO4COBfO_EfHcwSbagYgO1F8u9_1CFb0RSF/exec";

  function showSuccessAndReturn() {
    document.body.innerHTML = `
      <div style="font-family:system-ui, -apple-system, sans-serif; padding:20px; max-width:700px; margin:0 auto;">
        <h3>Submitted successfully ✅</h3>
        <p>Returning to the home screen…</p>
      </div>`;
    setTimeout(() => { window.location.href = "index.html"; }, 1500);
  }

  document.getElementById("volForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const hoursRaw = document.getElementById("hours").value;
    const hours = Number(hoursRaw);

    if (!name || hoursRaw === "" || Number.isNaN(hours) || hours < 0) {
      alert("Please enter a valid name and hours.");
      return;
    }

    const payload = JSON.stringify({
      type: "volunteer",
      name,
      hours
    });

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: payload
      });

      // With no-cors we can't read the response, but it will submit.
      showSuccessAndReturn();
    } catch (err) {
      alert("Submission failed. Please check internet and try again.");
      console.error(err);
    }
  });
</script>
</body>
</html>
