<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer Hours</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; }
    label { display:block; margin-top: 14px; font-weight: 650; }
    input, textarea { width: 100%; font-size: 18px; padding: 12px; margin-top: 6px; border-radius: 10px; border: 1px solid #ccc; }
    button { margin-top: 18px; width: 100%; font-size: 20px; padding: 14px; border-radius: 12px; border: 1px solid #ccc; }
    .top { display:flex; gap:12px; align-items:center; }
    .top a { text-decoration:none; font-size:16px; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">← Back</a>
    <h2 style="margin:0;">Volunteer Hours</h2>
  </div>

  <form id="volForm" autocomplete="off">
    <label for="name">Name</label>
    <input id="name" name="name" required />

    <label for="hours">Hours volunteered</label>
    <input id="hours" name="hours" type="number" step="0.25" min="0" required />

    <button type="submit">Submit</button>
  </form>
  <script>
  // Put your real endpoint here later (Power Automate / API). Leave blank for now to just loop back.
  const VOLUNTEER_ENDPOINT = ""; // e.g. "https://YOUR-ENDPOINT-HERE"

  function showSuccessAndReturn() {
    document.body.innerHTML = `
      <div style="font-family:system-ui, -apple-system, sans-serif; padding:20px; max-width:700px; margin:0 auto;">
        <h3>Submitted successfully ✅</h3>
        <p>Returning to the home screen…</p>
      </div>`;
    setTimeout(() => { window.location.href = "index.html"; }, 1500);
  }

  document.getElementById("volForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const hours = Number(document.getElementById("hours").value);

    if (!name || Number.isNaN(hours) || hours < 0) {
      alert("Please enter a valid name and hours.");
      return;
    }

    // If no backend yet, still loop back like a kiosk.
    if (!VOLUNTEER_ENDPOINT) {
      showSuccessAndReturn();
      return;
    }

    try {
      const res = await fetch(VOLUNTEER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "volunteer", name, hours })
      });
      if (!res.ok) throw new Error("Request failed");
      showSuccessAndReturn();
    } catch (err) {
      alert("Submission failed. Check your endpoint and internet connection.");
    }
  });
</script>
</body>
</html>
