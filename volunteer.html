<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volunteer Hours</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:"Work Sans",system-ui;background:#f6f8fb}
.page{max-width:860px;margin:0 auto;padding:30px}
.top{display:flex;gap:12px;align-items:center}
.top a{text-decoration:none;color:#005a96;font-weight:700}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.08);padding:24px}
label{display:block;margin-top:16px;font-weight:800}
input, select{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:12px;
  border:2px solid #ccc;
  box-sizing:border-box;
}
button{
  margin-top:20px;
  width:100%;
  padding:16px;
  font-size:20px;
  border:none;
  border-radius:14px;
  font-weight:800;
  color:#fff;
  background:#0072bc;
  cursor:pointer;
}

/* Area selector */
.area-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:10px;
  margin-top:10px;
}

.area{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:12px;
  border:2px solid rgba(0,90,150,.18);
  background:#fff;
  cursor:pointer;
  font-weight:600;
  user-select:none;
}

.area input{display:none;}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:3px solid #0072bc;
  display:inline-block;
  position:relative;
}

.area input:checked + .dot::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  background:#0072bc;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

#subAreaWrap, #otherAreaBox, #otherSubBox{display:none;margin-top:14px;}

/* Processing overlay */
#processingOverlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #ddd;
  border-top:4px solid #0072bc;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:15px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>
<div class="page">
  <div class="top">
    <a href="index.html">← Back</a>
    <h2>Volunteer Hours</h2>
  </div>

  <div class="card">
    <form id="volForm">

      <label>Name</label>
      <input id="name" required>

      <label>Hours volunteered</label>
      <input id="hours" type="number" step="0.25" min="0" required>

      <button type="submit">Submit</button>

      <hr style="margin:24px 0; border:none; border-top:1px solid #ddd;">

      <label style="color:#666;font-weight:600;">Volunteer Area (for reference only)</label>

      <div class="area-grid">
        <label class="area">
          <input type="radio" name="area" value="Life Care Office" checked>
          <span class="dot"></span>
          Life Care Office
        </label>
        <label class="area">
          <input type="radio" name="area" value="Resident Services">
          <span class="dot"></span>
          Resident Services
        </label>
        <label class="area">
          <input type="radio" name="area" value="Willow Brook Court">
          <span class="dot"></span>
          Willow Brook Court
        </label>
        <label class="area">
          <input type="radio" name="area" value="Oak Bridge Terrace">
          <span class="dot"></span>
          Oak Bridge Terrace
        </label>
        <label class="area">
          <input type="radio" name="area" value="Administration">
          <span class="dot"></span>
          Administration
        </label>
        <label class="area">
          <input type="radio" name="area" value="Off Campus">
          <span class="dot"></span>
          Off Campus
        </label>
        <label class="area">
          <input type="radio" name="area" value="Chaplain">
          <span class="dot"></span>
          Chaplain
        </label>
        <label class="area">
          <input type="radio" name="area" value="Other Area" id="otherAreaOption">
          <span class="dot"></span>
          Other
        </label>
      </div>

      <div id="otherAreaBox">
        <input type="text" id="otherAreaText" placeholder="Please specify the volunteer area...">
      </div>

      <div id="subAreaWrap">
        <label style="font-weight:600;">Sub-Area (for reference only)</label>
        <select id="subAreaSelect">
          <option value="">Select a sub-area…</option>
        </select>

        <div id="otherSubBox">
          <input type="text" id="otherSubText" placeholder="Please specify the activity...">
        </div>
      </div>

    </form>
  </div>
</div>

<div id="processingOverlay">
  <div class="spinner"></div>
  <h3>Processing...</h3>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0SzgDWMhx1x9pXNJzOKvh2oFpScZ04cO4COBfO_EfHcwSbagYgO1F8u9_1CFb0RSF/exec";

const SUB_AREAS = {
  "Life Care Office":["Clerical","Luncheon","Tour Guide","Hosting","Show Apartment"],
  "Resident Services":["Acts TV","Assist with Entertainment","Lead Activities","Newsletter","Assist Life Engagement"],
  "Willow Brook Court":["Assist Staff","Activities","Mail Distribution","Assist Residents","Volunteer Visits","Escort/Transport Residents"],
  "Oak Bridge Terrace":["Assist Staff","Activities","Hydration Program","Mail Distribution","Volunteer Visits","Escort/Transport Residents"],
  "Administration":["In-house Mail","Distribution","Clerical","Packages","Gift Shop","Other"],
  "Off Campus":["Volunteer Work Done Outside of Acts"],
  "Chaplain":["Teaching","Preaching","Music Ministry","Spiritual Committee","Service Assistant","Card/Flower Distribution","Other"]
};

const areaRadios=document.querySelectorAll('input[name="area"]');
const subAreaWrap=document.getElementById("subAreaWrap");
const subAreaSelect=document.getElementById("subAreaSelect");
const otherAreaBox=document.getElementById("otherAreaBox");
const otherAreaOption=document.getElementById("otherAreaOption");
const otherSubBox=document.getElementById("otherSubBox");

function populateSubAreas(area){
  subAreaSelect.innerHTML='<option value="">Select a sub-area…</option>';
  (SUB_AREAS[area]||[]).forEach(item=>{
    const opt=document.createElement("option");
    opt.value=item;
    opt.textContent=item;
    subAreaSelect.appendChild(opt);
  });
}

function handleAreaChange(){
  const selected=document.querySelector('input[name="area"]:checked')?.value;
  if(selected==="Other Area"){
    otherAreaBox.style.display="block";
    subAreaWrap.style.display="none";
    return;
  }
  otherAreaBox.style.display="none";
  if(selected && SUB_AREAS[selected]){
    populateSubAreas(selected);
    subAreaWrap.style.display="block";
  } else {
    subAreaWrap.style.display="none";
  }
}

subAreaSelect.addEventListener("change",()=>{
  otherSubBox.style.display=subAreaSelect.value==="Other"?"block":"none";
});

areaRadios.forEach(r=>r.addEventListener("change",handleAreaChange));
handleAreaChange();

/* Submit */
document.getElementById("volForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const hours=Number(document.getElementById("hours").value);
  if(!name||isNaN(hours)||hours<0){alert("Please enter valid information.");return;}

  const overlay=document.getElementById("processingOverlay");
  const btn=e.target.querySelector("button");
  btn.disabled=true;
  btn.style.opacity="0.6";
  overlay.style.display="flex";

  await fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({type:"volunteer",name,hours})
  });

  document.body.innerHTML="<h2 style='text-align:center;margin-top:40px'>Submitted successfully ✅</h2>";
  setTimeout(()=>location.href="index.html",1500);
});
</script>
</body>
</html>
